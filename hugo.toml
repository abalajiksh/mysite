baseURL = 'https://ashwinbalaji.xyz/'
languageCode = 'en-us'
title = 'Ashwin Balaji'
theme = "poison"
pluralizelisttitles = false

[params]

front_page_content = ["posts", "projects"]

brand = "Ashwin Balaji"                      # name of your site - appears in the sidebar
    # brand_image = "dont_know.png"    # path to the image shown in the sidebar
    description = "Void's Whispers, a Journal of my Distractions and Everything in-between." # Used as default meta description if not specified in front matter
    dark_mode = true                      # optional - defaults to false
    # favicon = "favicon.png"

    github_url = "https://github.com/abalajiksh"
    codeberg_url = "https://codeberg.org/abksh"
    goodreads_url = "https://www.goodreads.com/ashwinbalaji"
    instagram_url = "https://www.instagram.com/ashwinbalaji00/"
    playstation_url = "https://profile.playstation.com/abksh1011"
    steam_url= "https://steamcommunity.com/id/ashwin-balaji/"
    strava_url = "https://www.strava.com/athletes/ashwinbalaji"
    lastfm_url = "https://www.last.fm/user/abksh"
    listenbrainz_url = "https://listenbrainz.org/user/abksh"
    discord_url="https://discord.com/users/1100676348172836884"

    # Accessibility: theme default link blue (#268bd2) is 3.5:1 on the light
    # background, below WCAG AA (4.5:1). Same hue, darker in light mode,
    # slightly lighter in dark mode so it also clears 4.5:1 inside notice boxes.
    link_color = "#1a6fb0"
    link_color_dark = "#3b9be6"




menu = [
    {Name = "About", URL = "/about/", HasChildren = false},
    {Name = "Topics", URL = "/topics/", HasChildren = false},
    {Name = "Datenschutzerklärung", URL = "/datenschutz/", HasChildren = false},
    {Name = "Series", URL = "/series/", HasChildren = false},
    {Name = "Posts", URL = "/posts/", Pre = "Recent", HasChildren = true, Limit = 2},
    ]

    remark42 = true
    remark42_host = "https://comment.ashwinbalaji.xyz"
    remark42_site_id = "ashwinbalaji"

[taxonomies]
    series = 'series'
    tags = 'tags'
    topics = 'topics'